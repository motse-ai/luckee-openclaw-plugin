name: Bump Plugin Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version bump]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Skip when version was already changed
        id: version_files
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- plugin/package.json plugin/package-lock.json plugin/openclaw.plugin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.version_files.outputs.changed == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump patch version
        if: steps.version_files.outputs.changed == 'false'
        run: |
          node <<'EOF'
          const fs = require('fs');

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }

          function writeJson(path, data) {
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          function bumpPatch(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) {
              throw new Error(`Unsupported version format: ${version}`);
            }

            const [, major, minor, patch] = match;
            return `${major}.${minor}.${Number(patch) + 1}`;
          }

          const packageJsonPath = 'plugin/package.json';
          const lockfilePath = 'plugin/package-lock.json';
          const manifestPath = 'plugin/openclaw.plugin.json';

          const packageJson = readJson(packageJsonPath);
          const lockfile = readJson(lockfilePath);
          const manifest = readJson(manifestPath);

          const nextVersion = bumpPatch(manifest.version);

          packageJson.version = nextVersion;
          lockfile.version = nextVersion;
          if (lockfile.packages && lockfile.packages['']) {
            lockfile.packages[''].version = nextVersion;
          }
          manifest.version = nextVersion;

          writeJson(packageJsonPath, packageJson);
          writeJson(lockfilePath, lockfile);
          writeJson(manifestPath, manifest);

          fs.writeFileSync(process.env.GITHUB_ENV, `NEXT_VERSION=${nextVersion}\n`, { flag: 'a' });
          console.log(`Bumped plugin version to ${nextVersion}`);
          EOF

      - name: Commit and push version bump
        if: steps.version_files.outputs.changed == 'false'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/package.json plugin/package-lock.json plugin/openclaw.plugin.json
          git commit -m "chore: bump plugin version to ${NEXT_VERSION} [skip version bump]"
          git push origin HEAD:${GITHUB_REF_NAME}
