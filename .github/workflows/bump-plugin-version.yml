name: Bump Plugin Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump version from commit count
        id: bump
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          node <<EOF
          const fs = require('fs');

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }

          function writeJson(path, data) {
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }

          const commitCount = ${COMMIT_COUNT};

          const packageJsonPath = 'plugin/package.json';
          const lockfilePath = 'plugin/package-lock.json';
          const manifestPath = 'plugin/openclaw.plugin.json';

          const packageJson = readJson(packageJsonPath);
          const lockfile = readJson(lockfilePath);
          const manifest = readJson(manifestPath);

          const currentVersion = manifest.version;
          const match = currentVersion.match(/^(\d+)\.(\d+)\.\d+$/);
          if (!match) {
            console.error('Unsupported version format: ' + currentVersion);
            process.exit(1);
          }
          const [, major, minor] = match;
          const nextVersion = major + '.' + minor + '.' + commitCount;

          if (nextVersion === currentVersion) {
            console.log('Version already at ' + currentVersion + ', nothing to bump.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'skipped=true\n');
            process.exit(0);
          }

          packageJson.version = nextVersion;
          lockfile.version = nextVersion;
          if (lockfile.packages && lockfile.packages['']) {
            lockfile.packages[''].version = nextVersion;
          }
          manifest.version = nextVersion;

          writeJson(packageJsonPath, packageJson);
          writeJson(lockfilePath, lockfile);
          writeJson(manifestPath, manifest);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'skipped=false\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'NEXT_VERSION=' + nextVersion + '\n');
          console.log('Bumped plugin version to ' + nextVersion);
          EOF

      - name: Commit and push version bump
        if: steps.bump.outputs.skipped == 'false'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/package.json plugin/package-lock.json plugin/openclaw.plugin.json
          git commit -m "chore: bump plugin version to ${NEXT_VERSION} [skip version bump]"
          git push origin HEAD:${GITHUB_REF_NAME}
