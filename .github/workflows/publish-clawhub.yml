name: Publish to ClawHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-clawhub-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve release version
        id: version
        run: |
          DEFAULT_VERSION="$(node -p "require('./plugin/openclaw.plugin.json').version")"
          IFS='.' read -r MAJOR MINOR _ <<< "${DEFAULT_VERSION}"
          DATE_PART="$(date -u +%Y%d%m)"
          COUNTER_PAD="01"
          TAG_PREFIX="v${MAJOR}.${MINOR}.${DATE_PART}"
          LAST_TAG="$(git ls-remote --tags --refs origin "${TAG_PREFIX}*" | awk -F/ '{print $3}' | sort -V | tail -n1)"
          if [ -n "${LAST_TAG}" ]; then
            LAST_NUM="${LAST_TAG##*${DATE_PART}}"
            NEXT_NUM=$((10#${LAST_NUM} + 1))
            COUNTER_PAD="$(printf '%02d' ${NEXT_NUM})"
          fi
          VERSION="${MAJOR}.${MINOR}.${DATE_PART}${COUNTER_PAD}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: tag_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip duplicate publish
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} already exists."
          echo "Skipping ClawHub publish and tag creation."

      - name: Login to ClawHub
        if: steps.tag_check.outputs.exists == 'false'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "Missing required secret: CLAWHUB_TOKEN" >&2
            exit 1
          fi
          npx -y clawhub login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Publish skill to ClawHub
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          SKILL_SLUG="luckee-skill"
          npx -y clawhub whoami
          set +e
          OUTPUT="$(npx -y clawhub publish ./skill --slug "${SKILL_SLUG}" --name "Luckee Skill" --version "${{ steps.version.outputs.version }}" --tags latest 2>&1)"
          STATUS=$?
          set -e
          echo "${OUTPUT}"
          if [ ${STATUS} -ne 0 ]; then
            if [[ "${OUTPUT}" == *"Version already exists"* ]]; then
              echo "Version ${{ steps.version.outputs.version }} already exists on ClawHub."
              echo "Continuing to tag creation."
              exit 0
            fi
            if [[ "${OUTPUT}" == *"Slug is already taken"* ]]; then
              echo "Publish failed: slug '${SKILL_SLUG}' exists but is not updatable by this token." >&2
              echo "Use a token for the slug owner, or change the slug for a separate skill." >&2
            fi
            exit ${STATUS}
          fi

      - name: Create and push git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
